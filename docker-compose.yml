version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: kumbh-postgres
    environment:
      POSTGRES_DB: kumbh_mela
      POSTGRES_USER: kumbh
      POSTGRES_PASSWORD: kumbh_secure_2027
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kumbh -d kumbh_mela"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kumbh-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
